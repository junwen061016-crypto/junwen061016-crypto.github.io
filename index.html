<!DOCTYPE html>
<html lang="zh-TW">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div class="container">

      <!-- 登入區塊 -->
      <div id="login-section" class="card">
        <h2>🔑 參與者登入 / 註冊</h2>
        <input typr="text" id="nickname" placeholder="請輸入暱稱(首次登入時設定) " />
        <input type="email" id="email" placeholder="請輸入您的 Email" />
        <input type="password" id="password" placeholder="請輸入密碼 (至少6碼)" />
        <select id="team-select">
          <option value="">請選擇你的隊伍</option>
          <option value="team_1">第一小隊</option>
          <option value="team_2">第二小隊</option>
          <option value="team_3">第三小隊</option>
          <option value="team_4">第四小隊</option>
          <option value="team_5">第五小隊</option>
        </select>
        <button id="btn-login">進入破冰冒險</button>
      </div>

      <!-- 遊戲主畫面 (登入後顯示) -->
      <div id="game-section" style="display: none;">
        <img src="/welcome-banner.png" alt="Welcome to CSMU MU" class="welcome-banner" />
        <!-- 1. 個人檔案卡 -->
        <div class="card profile-card">
          <div class="profile-header">
            <div class="profile-avatar">👤</div>
            <div class="profile-info">
              <h3 id="profile-email-display">載入中...</h3>
              <p id="profile-team-display" class="team-badge">小隊狀態：讀取中...</p>
            </div>
          </div>
          <div class="profile-stats">
            <div class="stat-item">
              <span class="stat-num" id="stat-scan-count">0</span>
              <span class="stat-label">已交友人數</span>
            </div>
            <div class="stat-item">
              <span class="stat-num" id="stat-bingo-count">0</span>
              <span class="stat-label">共鳴格子數</span>
            </div>
          </div>
        </div>

        <!-- 2. 個人 QR Code -->
        <div class="card card-qr" style="text-align: center;">
          <h2>👤 個人 QR Code</h2>
          <div class="qr-container" style="display: flex; justify-content: center; margin: 15px 0;">
            <canvas id="qr-canvas"></canvas>
          </div>
          <button id="btn-logout" style="background: #6c757d; width: auto; padding: 6px 15px;">登出帳號</button>
        </div>

        <!-- 3. 社交成就解鎖進度 -->
        <div class="card">
          <h2>🏆 社交成就獎勵</h2>
          <ul id="goals-list" style="list-style: none; padding: 0;"></ul>
        </div>

        <!-- 4. 小隊排行榜 -->
        <div class="card">
          <h2>📈 小隊榮譽排行榜</h2>
          <ul id="leaderboard" style="list-style: none; padding: 0;"></ul>
        </div>

        <!-- 5. 掃碼交友（掃描器） -->
        <div class="card card-scan">
          <h2>📷 掃描新朋友 QR Code</h2>
          <div id="reader" style="width: 100%;"></div>
        </div>

        <!-- 6. 5x5 賓果共鳴填寫與顯示區塊 -->
        <div class="card">
          <h2>🎯 5x5 靈魂共鳴話題</h2>
          <p style="font-size: 0.9rem; color: #666; margin-bottom: 10px;">請在對應的格子內填寫你的答案，全部填滿後點擊下方按鈕鎖定。</p>
          <!-- JS 會在這裡動態生成 25 格的題目和輸入框 -->
          <div id="bingo-grid" class="bingo-grid"></div>
        </div>

      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
